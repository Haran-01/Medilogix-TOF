<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Email confirmed | MedilogiX</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#1d2b40;background:#f4f7fb;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,520px);padding:36px;border:1px solid #dfe7f0;border-radius:16px;background:#fff;box-shadow:0 12px 40px #21354d12;text-align:center}
    img{width:176px;height:auto;margin:0 auto 28px}h1{margin:0 0 12px;font-size:25px;letter-spacing:-.4px}p{margin:0;color:#60738a;font-size:15px;line-height:1.65}
    .mark{width:48px;height:48px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#e7f6ee;color:#15966e;font-size:25px;font-weight:700}
    .hint{margin-top:18px;padding:14px;border-radius:8px;background:#f4f8fb;color:#52677e;font-size:13px}
    @media(max-width:480px){main{padding:28px 22px}h1{font-size:22px}}
  </style>
</head>
<body>
  <main>
    <img src="medilogix-logo.png" alt="MedilogiX">
    <div class="mark" id="status-mark" aria-hidden="true">✓</div>
    <h1 id="status-title">Email confirmed</h1>
    <p id="status-message">Your email address has been confirmed. Return to the MedilogiX desktop app and sign in with the same email and password you used to create your account.</p>
    <p class="hint">You can close this page after returning to the app.</p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);
      const failed = params.has('error') || params.has('error_code') || query.has('error') || query.has('error_code');
      if (failed) {
        document.getElementById('status-mark').textContent = '!';
        document.getElementById('status-mark').style.background = '#fff4e7';
        document.getElementById('status-mark').style.color = '#a65b00';
        document.getElementById('status-title').textContent = 'Email could not be confirmed';
        document.getElementById('status-message').textContent = 'This confirmation link may have expired or already been used. Return to the MedilogiX app and try signing in. If that does not work, create a new confirmation email.';
      }
      // Supabase may return short-lived tokens in the URL fragment. This page never uses or stores them.
      if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
    })();
  </script>
</body>
</html>
